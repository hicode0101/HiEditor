# HiEditor 多平台构建：
#   - 推送 v* 标签（如 v1.2.3）→ 四平台自动构建，zip 以该版本号命名，并自动创建 GitHub Release
#   - tag 版本号会回写进 tauri.conf.json 再编译，exe 属性/关于页显示的版本与 tag、压缩包名三者统一
#   - workflow_dispatch 手动触发保留：版本号取默认 1.0.0，不改写 tauri.conf.json
# 如需恢复 push main 分支自动构建，在 on.push 下追加 branches: [main]

name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动触发保留

jobs:
  build:
    strategy:
      fail-fast: false # 一个平台失败不影响其它平台出包
      matrix:
        include:
          - os: windows-latest # Windows x64
            platform: win64
            script: package-win-release.bat
          - os: ubuntu-latest # Linux x64
            platform: linux64
            script: package-linux-release.sh
          - os: macos-14 # macOS Intel 包：GitHub 已淘汰 macos-13（Intel）机型，
            platform: mac64 # 改在 arm64 机器上交叉编译 x86_64，Intel 支持不中断
            script: package-mac-release.sh
            rust-target: x86_64-apple-darwin
          - os: macos-14 # macOS Apple Silicon (M 系列)
            platform: mac-arm64
            script: package-mac-release.sh

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }} # 交叉编译目标（原生构建为空，无副作用）

      - name: Cargo 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 计算版本号（tag v1.2.3 → 1.2.3，手动触发用默认 1.0.0）
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: 版本号统一回写 tauri.conf.json（exe 属性/关于页 = tag 版本）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash # 三平台通用：windows-latest 上走 Git Bash，sed -i.bak 兼容 GNU/BSD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak 's/"version": *"[^"]*"/"version": "'"${VERSION}"'"/' crates/hi-editor-app/tauri.conf.json
          rm -f crates/hi-editor-app/tauri.conf.json.bak
          echo "tauri.conf.json version → $(grep -o '"version": *"[^"]*"' crates/hi-editor-app/tauri.conf.json | head -1)"

      - name: 安装 Linux 构建依赖（Tauri v2）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zip

      - name: 打包（Windows）
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          CI: true
        run: echo N| package-win-release.bat ${{ steps.ver.outputs.version }}

      - name: 打包（Linux / macOS）
        if: matrix.os != 'windows-latest'
        env:
          CI: true
        run: |
          chmod +x "${{ matrix.script }}"
          # 第 4 参 = Rust 交叉编译目标（原生构建为空）；第 2/3 参保持脚本默认
          ./${{ matrix.script }} "${{ steps.ver.outputs.version }}" "" dist "${{ matrix.rust-target }}"

      - name: 校验产物存在
        shell: bash
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.zip' -print -quit)" || { echo "::error::未找到 zip 产物"; exit 1; }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HiEditor-${{ matrix.platform }}-v${{ steps.ver.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    # 打 v* 标签时：汇总四平台 zip 自动创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
