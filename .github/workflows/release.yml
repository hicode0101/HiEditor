# HiEditor 多平台自动构建：push 到 main 或推送 v* 标签时，构建四平台发布包
# 产物（zip）挂到本次运行的艺术品区；打 tag 时额外自动创建 GitHub Release

name: Release Build

on:
  push:
    # 如果没有下面的 branches tags 配置内容，则PUSH 不会触发
    #branches: [main]
    #tags: ["v*"]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    strategy:
      fail-fast: false # 一个平台失败不影响其它平台出包
      matrix:
        include:
          - os: windows-latest # Windows x64
            platform: win64
            script: package-win-release.bat
          - os: ubuntu-latest # Linux x64
            platform: linux64
            script: package-linux-release.sh
          - os: macos-13 # macOS Intel
            platform: mac64
            script: package-mac-release.sh
          - os: macos-14 # macOS Apple Silicon (M 系列)
            platform: mac-arm64
            script: package-mac-release.sh

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 计算版本号（tag v1.2.3 → 1.2.3，普通 push 用默认 1.0.0）
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Linux 构建依赖（Tauri v2）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zip

      - name: 打包（Windows）
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          CI: true
        run: echo N| package-win-release.bat ${{ steps.ver.outputs.version }}

      - name: 打包（Linux / macOS）
        if: matrix.os != 'windows-latest'
        env:
          CI: true
        run: |
          chmod +x "${{ matrix.script }}"
          ./${{ matrix.script }} "${{ steps.ver.outputs.version }}"

      - name: 校验产物存在
        shell: bash
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.zip' -print -quit)" || { echo "::error::未找到 zip 产物"; exit 1; }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HiEditor-${{ matrix.platform }}-v${{ steps.ver.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    # 打 v* 标签时：汇总四平台 zip 自动创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
