<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无标题 - HiEditor</title>
  <script>
    // 临时诊断：前端错误写入窗口标题
    window.onerror = function (msg, src, line, col) {
      document.title = "ERR:" + msg + " @" + String(src).split("/").pop() + ":" + line;
    };
    window.onunhandledrejection = function (ev) {
      document.title = "REJ:" + ((ev.reason && ev.reason.message) || ev.reason);
    };
  </script>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <!-- A 区：标题栏 / 标签条（40px，#202020） -->
  <header id="titlebar">
    <div class="app-icon" data-tauri-drag-region></div>
    <div class="app-name" data-tauri-drag-region>HiEditor</div>
    <div id="tabs"></div>
    <button id="btn-new-tab" class="tb-icon-btn" data-i18n-title="file.newTab"></button>
    <div class="tb-spacer" data-tauri-drag-region></div>
    <div class="caption">
      <button id="cap-min" class="cap-btn" data-i18n-title="caption.minimize"></button>
      <button id="cap-max" class="cap-btn" data-i18n-title="caption.maximize"></button>
      <button id="cap-close" class="cap-btn cap-close" data-i18n-title="caption.close"></button>
    </div>
  </header>

  <!-- B 区：菜单 / 工具行（40px，#f9f9f9） -->
  <nav id="row-b">
    <div class="menu-group">
      <button class="menu-btn" data-menu="file" data-i18n="menu.file">文件</button>
      <button class="menu-btn" data-menu="edit" data-i18n="menu.edit">编辑</button>
      <button class="menu-btn" data-menu="search" data-i18n="menu.search">搜索</button>
      <button class="menu-btn" data-menu="view" data-i18n="menu.view">查看</button>
    </div>

    <div class="toolbar-wrap">
      <!-- 默认工具栏：字体/字号（所有未声明自定义工具栏的语言通用） -->
      <div id="toolbar-font" class="toolbar" hidden>
        <span class="tl-label" data-i18n="toolbar.fontFamily">字体</span>
        <select id="tl-font-family" class="tl-select"></select>
        <span class="tl-label" data-i18n="toolbar.fontSize">字号</span>
        <select id="tl-font-size" class="tl-select"></select>
      </div>
      <!-- 插件自定义工具栏：容器 id = toolbar-{config.json toolbar.id}（如 markdown-wysiwyg） -->
      <div id="toolbar-markdown-wysiwyg" class="toolbar" hidden>
        <button class="tl-btn" data-md="bold" data-i18n-title="toolbar.bold"><span class="glyph bold">B</span></button>
        <button class="tl-btn" data-md="italic" data-i18n-title="toolbar.italic"><span class="glyph italic">I</span></button>
        <button class="tl-btn" data-md="underline" data-i18n-title="toolbar.underline"><span class="glyph underline">U</span></button>
        <button class="tl-btn" data-md="strike" data-i18n-title="toolbar.strike"><span class="glyph strike">S</span></button>
        <button class="tl-btn" data-md="clear" data-i18n-title="toolbar.clearFormat"><span class="tl-ico" data-ico="eraser"></span></button>
        <span class="tl-sep"></span>
        <button class="tl-btn tl-wide" data-md="heading"><span class="h-label">H</span><span class="chev"></span></button>
        <button class="tl-btn" data-md="hr" data-i18n-title="toolbar.hr"><span class="tl-ico" data-ico="hr"></span></button>
        <button class="tl-btn" data-md="quote" data-i18n-title="toolbar.quote"><span class="glyph quote">❝</span></button>
        <button class="tl-btn" data-md="ul" data-i18n-title="toolbar.ul"><span class="tl-ico" data-ico="list-bullet"></span></button>
        <button class="tl-btn" data-md="ol" data-i18n-title="toolbar.ol"><span class="tl-ico" data-ico="list-ol"></span></button>
        <button class="tl-btn" data-md="task" data-i18n-title="toolbar.task"><span class="tl-ico" data-ico="task"></span></button>
        <button class="tl-btn" data-md="task-done" data-i18n-title="toolbar.taskDone"><span class="tl-ico" data-ico="task-checked"></span></button>
        <span class="tl-sep"></span>
        <button class="tl-btn" data-md="link" data-i18n-title="toolbar.link"><span class="tl-ico" data-ico="link"></span></button>
        <button class="tl-btn" data-md="image" data-i18n-title="toolbar.image"><span class="tl-ico" data-ico="image"></span></button>
        <button class="tl-btn" data-md="code" data-i18n-title="toolbar.codeInline"><span class="glyph code">&lt;/&gt;</span></button>
        <button class="tl-btn" data-md="codeblock" data-i18n-title="toolbar.codeBlock"><span class="tl-ico" data-ico="code-block"></span></button>
        <button class="tl-btn" data-md="table" data-i18n-title="toolbar.table"><span class="tl-ico" data-ico="table"></span></button>
        <span class="tl-sep"></span>
        <button class="tl-btn" data-md="formula" data-i18n-title="toolbar.formula"><span class="glyph sigma">Σ</span></button>
        <button class="tl-btn" data-md="chem" data-i18n-title="toolbar.chem" disabled><span class="tl-ico" data-ico="flask"></span></button>
        <button class="tl-btn" data-md="mermaid" data-i18n-title="toolbar.mermaid" disabled><span class="tl-ico" data-ico="flowchart"></span></button>
        <button class="tl-btn" data-md="timeline" data-i18n-title="toolbar.timeline" disabled><span class="tl-ico" data-ico="timeline"></span></button>
        <button class="tl-btn" data-md="attachment" data-i18n-title="toolbar.attachment" disabled><span class="tl-ico" data-ico="attachment"></span></button>
        <span class="tl-sep"></span>        
        <button class="tl-btn" data-md="mode-source"><span class="tl-ico" data-ico="sourceCode"></span></button>
        <button class="tl-btn" data-md="mode-wysiwyg"><span class="tl-ico" data-ico="wysiwyg"></span></button>
        <span class="tl-sep"></span>
        <button class="tl-btn" data-md="help" data-i18n-title="toolbar.help"><span class="glyph help">?</span></button>
      </div>
    </div>

    <div class="right-group">
      <button id="btn-readaloud" class="rb-btn" data-i18n-title="toolbar.readAloudComing" disabled><span class="tl-ico" data-ico="read-aloud"></span></button>
      <button id="btn-settings" class="rb-btn" data-i18n-title="toolbar.settings"><span class="tl-ico" data-ico="settings"></span></button>
    </div>
  </nav>

  <!-- C 区：编辑区（CodeMirror 6 宿主）+ Markdown 预览 -->
  <main id="content">
    <div id="md-bar" hidden>
      <div class="md-seg">
        <button class="md-seg-btn" data-mdmode="edit" data-i18n="mdseg.edit">编辑</button>
        <button class="md-seg-btn" data-mdmode="preview" data-i18n="mdseg.preview">预览</button>
      </div>
    </div>
    <div id="editor"></div>
    <div id="md-preview" hidden></div>
    <div id="pdf-bar" hidden>
      <input id="pdf-page-input" class="pdf-page-input" type="text" inputmode="numeric" value="1" title="当前页码，输入后回车跳转" data-i18n-title="pdf.pageInput" />
      <span id="pdf-page-total" class="pdf-page-total">/ 0</span>
      <span class="pdf-sep"></span>
      <button id="pdf-fit-page" class="pdf-zbtn" title="适应页面" data-i18n-title="pdf.fitPage">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11M5.5 4.5h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="pdf-fit-width" class="pdf-zbtn" title="适应宽度" data-i18n-title="pdf.fitWidth">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 3.5v9M13.5 3.5v9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M5.2 8h5.6M5.2 8l1.9-1.9M5.2 8l1.9 1.9M10.8 8L8.9 6.1M10.8 8l-1.9 1.9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="pdf-sep"></span>
      <button id="pdf-zoom-out" class="pdf-zbtn" title="缩小" data-i18n-title="pdf.zoomOut">−</button>
      <span id="pdf-zoom-level" class="pdf-zoom-level">100%</span>
      <button id="pdf-zoom-in" class="pdf-zbtn" title="放大" data-i18n-title="pdf.zoomIn">＋</button>
    </div>
    <div id="pdf-view" hidden></div>
  </main>

  <!-- D 区：状态栏（36px，#f9f9f9） -->
  <footer id="statusbar">
    <button class="st-seg" id="st-linecol" title="转到行" data-i18n="status.lineCol0">行 1, 列 1</button>
    <span class="st-div"></span>
    <span class="st-seg static" id="st-chars" data-i18n="status.chars0">0 个字符</span>
    <span class="st-div"></span>
    <button class="st-seg" id="st-lang" title="高亮语言" data-i18n="status.plainText">纯文本</button>
    <span class="st-div"></span>
    <span class="st-flex"></span>
    <button class="st-seg" id="st-zoom">100%</button>
    <span class="st-div"></span>
    <button class="st-seg" id="st-eol">Windows (CRLF)</button>
    <span class="st-div"></span>
    <button class="st-seg" id="st-enc">UTF-8</button>
  </footer>

  <!-- 设置模态框（UI-5.8 v1.7）：遮罩 + 居中对话框，打开期间阻塞主窗口操作 -->
  <div id="settings-modal" hidden>
    <section id="settings-page"></section>
  </div>

  <!-- 浮层挂载点（下拉菜单 / 错误对话框） -->
  <div id="overlay-layer"></div>
  <div id="tooltip" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
